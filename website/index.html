<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <title>Klepsydry @ Soiree</title>
    <link rel="stylesheet" href="css/base.css">
  </head>
  <body>
    <main role="main" class="container">
      <h1 class="mt-5">Klepsydry @ Soiree</h1>

      <div class="form-group">
        <label for="cemetery-registers-search" class="form-entity">Wyszukaj swój rejestr cmentarny:</label>
        <input id="cemetery-registers-search" name="search" class="form-control form-entity">
      </div>
      <button id="cemetery-registers-button" type="submit" class="btn btn-primary form-entity">Szukaj</button>

      <h4 id='results-title' class="mt-3 d-none">Wyniki wyszukiwania:</h4>
      <div id="results"></div>
      <button id="previous" class="btn btn-secondary d-none">Poprzednia strona</button>
      <button id="next" class="btn btn-secondary d-none">Następna strona</button>
    </main>

    <footer class="footer">
      <div class="container">
        <span class="text-muted"><i>Czas ucieka, wieczność czeka.</i></span>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>

    <script src="js/index.js"></script>
  </body>
</html>
