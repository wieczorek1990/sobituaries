<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nekrologi @ Soiree</title>
    <link href='https://fonts.googleapis.com/css?family=Source+Code+Pro' rel='stylesheet'>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css" rel="stylesheet">
    <link href="css/base.css" rel="stylesheet">
  </head>
  <body>
    <div class="table">
      <div class="cell center-both">
        <main role="main">
          <h1 id="website-title">Nekrologi @ Soiree</h1>

          <div id="search-site">
            <div class="form-group">
              <label for="cemetery-registers-search" class="form-entity">Wyszukaj swój rejestr cmentarny:</label>
              <input id="cemetery-registers-search" name="search" class="form-entity">
            </div>
            <button id="cemetery-registers-button" class="btn form-entity">Szukaj</button>

            <h2 id='results-title' class="d-none">Wyniki wyszukiwania:</h2>
            <div id="results"></div>
            <button id="previous" class="btn d-none">Poprzednia strona</button>
            <button id="next" class="btn d-none">Następna strona</button>
            <br/>
            <p><a id="cemetery-register-create" href="#/cemetery-register-create/">Stwórz rejestr cementarny</a></p>
          </div>

          <div id="retrieve-site" class="d-none">
            <div id="results-retrieve"></div>
            <p><a href="#/">⏎</a></p>
          </div>

          <div id="create-site" class="d-none">
            <div id="cemetery-register-create-form">
              <div class="form-group">
                <label for="cemetery-register-title" class="form-entity">Tytuł:</label>
                <input id="cemetery-register-title" name="title" class="form-entity">
                <br/>
                <label for="cemetery-register-description" class="form-entity">Opis:</label>
                <textarea id="cemetery-register-description" name="description" class="form-entity" rows="4"></textarea>
              </div>
              <br/>
              <button id="cemetery-register-create-button" class="btn form-entity">Stwórz</button>
            </div>
            <p id="cemetery-register-create-success" class="d-none">Stworzono rejestr cmentarny.</p>
            <p id="cemetery-register-create-failure" class="d-none red">Nie udało się stworzyć rejestru cmentarnego.</p>
            <p><a href="#/">⏎</a></p>
          </div>
        </main>
      </div>
    </div>

    <footer class="footer">
      <span id="footer-span" class="highlight"><i>Czas ucieka, wieczność czeka.</i></span>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="js/index.js"></script>
  </body>
</html>
