<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nekrologi @ Soiree</title>
    <link href='https://fonts.googleapis.com/css?family=Source+Code+Pro' rel='stylesheet'>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css" rel="stylesheet">
    <link href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css" rel="stylesheet">
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.css">
    <link href="css/base.css" rel="stylesheet">
  </head>
  <body>
    <div class="table">
      <div class="cell center-both">
        <main role="main">
          <h1 id="website-title">Nekrologi @ Soiree</h1>

          <div id="search-site">
            <div class="form-group">
              <label for="cemetery-registers-search" class="form-entity">Wyszukaj swój rejestr cmentarny:</label>
              <input id="cemetery-registers-search" name="search" class="form-entity">
            </div>
            <button id="cemetery-registers-button" class="btn form-entity">Szukaj</button>

            <h2 id='results-title' class="d-none">Wyniki wyszukiwania:</h2>
            <div id="results"></div>
            <button id="cemetery-register-previous" class="btn d-none">Poprzednia strona</button>
            <button id="cemetery-register-next" class="btn d-none">Następna strona</button>
            <p><a id="cemetery-register-create" href="#/cemetery-registers/">Stwórz rejestr cementarny</a></p>
          </div>

          <div id="retrieve-site" class="d-none">
            <div id="results-retrieve"></div>
            <button id="obituary-notice-previous" class="btn d-none">Poprzednia strona</button>
            <button id="obituary-notice-next" class="btn d-none">Następna strona</button>
            <p id="obituary-notice-create"></p>
            <a href="#/">⏎</a>
          </div>

          <div id="create-site" class="d-none">
            <div id="cemetery-register-create-form">
              <div class="form-group">
                <div class="tooltip">
                  <label for="cemetery-register-title" class="form-entity">Tytuł:</label>
                  <input id="cemetery-register-title" name="title" class="form-entity">
                  <span id="cemetery-register-tooltip-title" class="tooltiptext d-none"></span>
                </div>
                <br/>
                <div class="tooltip">
                  <label for="cemetery-register-description" class="form-entity">Opis:</label>
                  <textarea id="cemetery-register-description" name="description" class="form-entity" rows="4"></textarea>
                  <span id="cemetery-register-tooltip-description" class="tooltiptext d-none"></span>
                </div>
              </div>
              <br/>
              <br/>
              <button id="cemetery-register-create-button" class="btn form-entity">Stwórz</button>
            </div>
            <p id="cemetery-register-create-success" class="d-none">Stworzono rejestr cmentarny.</p>
            <p id="cemetery-register-create-failure" class="d-none red">Nie udało się stworzyć rejestru cmentarnego.</p>
            <p><a href="#/">⏎</a></p>
          </div>

          <div id="obituary-notice-create-site" class="d-none">
            <div id="obituary-notice-create-form">
              <div class="form-group">
                <div class="tooltip">
                  <label for="obituary-notice-death-date" class="form-entity">Data śmierci:</label>
                  <input id="obituary-notice-death-date" name="death_date" class="form-entity">
                  <span id="obituary-notice-tooltip-death-date" class="tooltiptext d-none"></span>
                </div>
                <br/>
                <div class="tooltip">
                  <label for="obituary-notice-titles" class="form-entity">Tytuły:</label>
                  <input id="obituary-notice-titles" name="titles" class="form-entity" placeholder="Mąż, Ojciec, Syn, Brat, Szwagier i Wujek" size="42">
                  <span id="obituary-notice-tooltip-titles" class="tooltiptext d-none"></span>
                </div>
                <br/>
                <div class="tooltip">
                  <label for="obituary-notice-first-name" class="form-entity">Imię:</label>
                  <input id="obituary-notice-first-name" name="first_name" class="form-entity">
                  <span id="obituary-notice-tooltip-first-name" class="tooltiptext d-none"></span>
                </div>
                <br/>
                <div class="tooltip">
                  <label for="obituary-notice-last-name" class="form-entity">Nazwisko:</label>
                  <input id="obituary-notice-last-name" name="last_name" class="form-entity">
                  <span id="obituary-notice-tooltip-last-name" class="tooltiptext d-none"></span>
                </div>
                <br/>
                <div class="tooltip">
                  <label for="obituary-notice-years-lived" class="form-entity">Lata życia:</label>
                  <input id="obituary-notice-years-lived" name="years_lived" class="form-entity" type="number" min="0">
                  <span id="obituary-notice-tooltip-years-lived" class="tooltiptext d-none"></span>
                </div>
                <br/>
                <div class="tooltip">
                  <label for="obituary-notice-holy-mass-date" class="form-entity">Data mszy pogrzebowej:</label>
                  <input id="obituary-notice-holy-mass-date" name="holy_mass_date" class="form-entity">
                  <br/>
                  <label for="obituary-notice-holy-mass-time" class="form-entity">Godzina mszy pogrzebowej:</label>
                  <input id="obituary-notice-holy-mass-time" name="holy_mass_time" class="form-entity">
                  <span id="obituary-notice-tooltip-holy-mass-datetime" class="tooltiptext d-none"></span>
                </div>
                <br/>
                <div class="tooltip">
                  <label for="obituary-notice-holy-mass-place" class="form-entity">Miejsce mszy pogrzebowej:</label>
                  <input id="obituary-notice-holy-mass-place" name="holy_mass_place" class="form-entity" placeholder="w kościele ... w ..." size="38">
                  <span id="obituary-notice-tooltip-holy-mass-place" class="tooltiptext d-none"></span>
                </div>
                <br/>
                <div class="tooltip">
                  <label for="obituary-notice-rosary-time" class="form-entity">Godzina różańca:</label>
                  <input id="obituary-notice-rosary-time" name="rosary_time" class="form-entity">
                  <span id="obituary-notice-tooltip-rosary-time" class="tooltiptext d-none"></span>
                </div>
                <br/>
                <div class="tooltip">
                  <label for="obituary-notice-rosary-place" class="form-entity">Miejsce różańca:</label>
                  <input id="obituary-notice-rosary-place" name="rosary_place" class="form-entity" placeholder="w kościele">
                  <span id="obituary-notice-tooltip-rosary-place" class="tooltiptext d-none"></span>
                </div>
                <br/>
                <div class="tooltip">
                  <label for="obituary-notice-body-or-ashes">Trumna z ciałem lub urna z prochami:</label>
                  <select name="body_or_ashes" id="obituary-notice-body-or-ashes">
                      <option value="body">Trumna z ciałem</option>
                      <option value="ashes">Urna z prochami</option>
                  </select>
                  <span id="obituary-notice-tooltip-body-or-ashes" class="tooltiptext d-none"></span>
                </div>
                <br/>
                <div class="tooltip">
                  <label for="obituary-notice-funeral-place" class="form-entity">Miejsce pogrzebu:</label>
                  <input id="obituary-notice-funeral-place" name="funeral_place" class="form-entity" placeholder="na cmentarzu parafialnym" size="24">
                  <span id="obituary-notice-tooltip-funeral-place" class="tooltiptext d-none"></span>
                </div>
              </div>
              <br/>
              <br/>
              <button id="obituary-notice-create-button" class="btn form-entity">Stwórz</button>
            </div>
            <p id="obituary-notice-create-success" class="d-none">Stworzono nekrolog.</p>
            <p id="obituary-notice-create-failure" class="d-none red">Nie udało się stworzyć nekrologu.</p>
            <p><a href="#/">⏎</a></p>
          </div>
        </main>
      </div>
    </div>

    <footer class="footer">
      <span id="footer-span" class="highlight"><i>Czas ucieka, wieczność czeka.</i></span>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js" integrity="sha256-VazP97ZCwtekAsvgPBSUwPFKdrwD3unUfSGVYrahUqU=" crossorigin="anonymous"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
